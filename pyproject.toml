[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-deep-clean"
version = "0.1.0"
description = "Cross-platform disk deep clean tool — zero dependencies, pure Python stdlib"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "knowingly"},
]
requires-python = ">=3.8"
keywords = ["disk-cleanup", "cleaner", "disk", "utility", "cross-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
disk-deep-clean = "scripts.auto_clean:main"
disk-deep-scan = "scripts.deep_scan:main"
disk-clean = "scripts.clean:main"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
